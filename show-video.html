<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Display</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
        }
        #video-container {
            display: none; /* Hidden by default */
            width: 80%;
            border: 5px solid white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            position: relative;
        }
        video {
            width: 100%;
            display: block;
        }
        #buttons {
            display: none;
            margin-top: 10px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video" controls>
            <source src="your-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div id="buttons">
            <button id="rewatch">Rewatch Video</button>
            <button id="close">Close</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('video-container');
        const buttons = document.getElementById('buttons');
        const rewatchButton = document.getElementById('rewatch');
        const closeButton = document.getElementById('close');

        // Check for the cookie
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = `expires=${date.toUTCString()}`;
            document.cookie = `${name}=${value}; ${expires}; path=/`;
        }

        // Show video only if cookie is not set
        if (!getCookie('IWatchedTheVideo')) {
            videoContainer.style.display = 'block';

            video.addEventListener('timeupdate', () => {
                // Set the cookie when 25% is watched
                if (video.currentTime / video.duration >= 0.25 && !getCookie('IWatchedTheVideo')) {
                    setCookie('IWatchedTheVideo', 'true', 7); // Set for 7 days
                }
            });

            video.addEventListener('ended', () => {
                buttons.style.display = 'block'; // Show buttons when video ends
            });
        }

        // Button actions
        rewatchButton.addEventListener('click', () => {
            video.currentTime = 0;
            video.play();
            buttons.style.display = 'none';
        });

        closeButton.addEventListener('click', () => {
            videoContainer.style.display = 'none';
        });
    </script>
</body>
</html>
